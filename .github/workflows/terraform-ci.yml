name: 'Terraform CI'

# La pipeline si attiva ogni volta che fai un Push o apri una Pull Request sul branch main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  terraform-ci:
    name: 'Terraform Fmt, Validate & Plan'
    runs-on: ubuntu-latest

    steps:
      # 1. Scarica il codice del repository sulla macchina di test di GitHub
      - name: Checkout del codice
        uses: actions/checkout@v4

      # 2. Configura le credenziali AWS usando i Secrets del repository
      - name: Configura credenziali AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-south-1 # Modifica con la tua regione AWS (es. eu-central-1, us-east-1)

      # 3. Installa l'eseguibile di Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Inizializza i provider (terraform init)
      - name: Terraform Init
        run: terraform init

      # 5. Verifica la formattazione del codice (terraform fmt -check)
      - name: Controllo Formattazione (fmt)
        run: terraform fmt -check

      # 6. Valida la sintassi del codice (terraform validate)
      - name: Validazione Codice (validate)
        run: terraform validate

      # 7. Esegue l'anteprima delle modifiche (terraform plan)
      - name: Anteprima Modifiche (plan)
        run: terraform plan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}